# Nova RP standalone template
# This file is a local example; txAdmin recipe generation creates the final version.

endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"

sv_hostname "Nova RP"
sv_maxclients 48

sets sv_projectName "Nova RP"
sets sv_projectDesc "Custom Nova RP FiveM Server"

set mysql_connection_string "mysql://USERNAME:PASSWORD@127.0.0.1/nova?charset=utf8mb4"

ensure nova-core
ensure nova-identity
ensure nova-spawn
ensure nova-notify
ensure nova-hud
ensure nova-admin

exec permissions.cfg
